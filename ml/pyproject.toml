[project]
name = "splitsound-ml"
version = "0.1.0"
description = "Model export, numpy reference implementations and benchmarks for SplitSound (HTDemucs v4 + AudioSet instrument tagger -> ONNX)."
license = "MIT"
requires-python = ">=3.11,<3.13"
# Exact versions and sha256 hashes of the whole closure live in uv.lock.
# Always install with `uv sync --locked` (or `uv run --locked ...`).
dependencies = [
    "torch>=2.6",
    "demucs==4.0.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "soundfile>=0.12",
    "zstandard>=0.23",
]

[dependency-groups]
# Static checkpoint scanners and the dependency auditor. Not needed to export
# or run anything; install with `uv sync --locked --group security`.
security = [
    "fickling==0.1.13",
    "picklescan==1.0.5",
    "pip-audit==2.10.1",
]
tagger = [
    "torchvision>=0.29.2",
]

[tool.uv]
package = false
# Only the public PyPI index is ever consulted.
index-url = "https://pypi.org/simple"
